<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:480px;overflow:hidden;background:#22352c}
.scr{width:320px;height:240px;transform:scale(2);transform-origin:0 0;position:relative;background:#22352c;color:#e8ece4;font:11px/1 'Atkinson Hyperlegible',sans-serif}
.top{height:20px;background:#1a2922;display:flex;align-items:center;padding:0 8px;gap:8px}
.top .p{flex:1;white-space:nowrap}
.dim{color:#93a99b}
.sm{font-size:8px}
.chip{font-size:8px;border:1px solid #93a99b;color:#93a99b;padding:1px 3px}
.ans{margin:6px 8px 0;border:1px solid #e8ece4;padding:4px 6px;display:flex;align-items:center;gap:6px;height:26px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:10px;line-height:10px}
.fr i{font-style:normal;border-top:1px solid currentColor;padding-top:1px}
sup{font-size:7px;vertical-align:5px;line-height:0}
.steps{position:absolute;top:60px;left:0;right:0;bottom:15px;overflow:hidden}
.st{padding:4px 8px 3px 14px;position:relative}
.cap{font-size:8px;color:#93a99b;margin-bottom:3px}
.ex{font-size:11px;white-space:nowrap}
.y{color:#f1d36a}
.sel{background:#2b4237}
.sel:before{content:"";position:absolute;left:6px;top:4px;bottom:3px;width:1px;background:#e8ece4}
.sub{margin-left:12px;padding:3px 0 2px 8px;border-left:1px solid #4a6355}
.mk{font-size:8px;color:#93a99b;margin-right:3px}
.foot{position:absolute;bottom:0;left:0;right:0;height:14px;background:#1a2922;display:flex;align-items:center;gap:9px;padding:0 8px;font-size:8px;color:#93a99b}
.foot b{color:#e8ece4;font-weight:700}
</style></head><body>
<div class="scr">
  <div class="top"><span class="p">2sin<sup>2</sup>x − sin x − 1 = 0</span><span class="dim sm">0 ≤ x ≤ 2π</span><span class="chip">RAD</span></div>
  <div class="ans"><span>x =</span>
    <span class="fr">π<i>2</i></span>,<span class="fr">7π<i>6</i></span>,<span class="fr">11π<i>6</i></span>
    <span class="dim sm" style="margin-left:auto">≈ 1.571, 3.665, 5.760</span></div>
  <div class="steps">
    <div class="st"><div class="cap">Let u = sin x</div><div class="ex">2<span class="y">u</span><sup class="y">2</sup> − <span class="y">u</span> − 1 = 0</div></div>
    <div class="st sel"><div class="cap"><span class="mk">▾</span>Factor</div><div class="ex"><span class="y">(2u + 1)(u − 1)</span> = 0</div>
      <div class="sub" style="margin-top:4px"><div class="cap">Split −u into −2u + u</div><div class="ex">2u<sup>2</sup> <span class="y">− 2u + u</span> − 1 = 0</div></div>
      <div class="sub"><div class="cap">Group in pairs</div><div class="ex"><span class="y">2u(u − 1) + (u − 1)</span> = 0</div></div>
    </div>
    <div class="st"><div class="cap">Set each factor to 0</div><div class="ex"><span class="y">u = −&thinsp;</span><span class="fr y">1<i>2</i></span> <span class="dim">or</span> <span class="y">u = 1</span></div></div>
  </div>
  <div class="foot"><span><b>▲▼</b> step</span><span><b>enter</b> collapse</span><span><b>y=</b> back</span><span><b>mode</b> deg</span><span style="margin-left:auto"><b>clear</b> quit</span></div>
</div>
</body></html>
